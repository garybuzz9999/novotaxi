name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
          npm install @codetrix-studio/capacitor-google-auth@3.4.0

      - name: Prepare web dir
        run: |
          mkdir -p www
          cp novotaxi.html www/index.html

      - name: Init Capacitor
        run: |
          npx cap init NovoTaxi com.novotaxi.app --web-dir www
          npx cap add android

      - name: Fix targetSdk to 34
        run: |
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/variables.gradle

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Generate Keystore & Build Release APK
        run: |
          keytool -genkey -v -keystore novotaxi.keystore \
            -alias novotaxi -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NovoTaxi, OU=App, O=NovoTaxi, L=Zvyahel, S=Zhytomyr, C=UA" \
            -storepass novotaxi2026 -keypass novotaxi2026
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/novotaxi.keystore \
            -Pandroid.injected.signing.store.password=novotaxi2026 \
            -Pandroid.injected.signing.key.alias=novotaxi \
            -Pandroid.injected.signing.key.password=novotaxi2026

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novotaxi-release
          path: android/app/build/outputs/apk/release/app-release.apk
