name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0

      - name: Prepare web dir
        run: |
          mkdir -p www
          cp novotaxi.html www/index.html

      - name: Init Capacitor
        run: |
          npx cap init NovoTaxi com.novotaxi.app --web-dir www
          npx cap add android

      - name: Fix targetSdk to 34
        run: |
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/variables.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novotaxi-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
